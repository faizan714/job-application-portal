{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h1>Login</h1>

<form method="POST">

    {% csrf_token %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <label>
        Username
    </label>

    <input
        type="text"
        name="username"
        required
    >

    <label>
        Password
    </label>

    <input
        type="password"
        name="password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<p>
    Don't have an account?

    <a href="{% url 'signup' %}">
        Create an account
    </a>
</p>

{% endblock %}
