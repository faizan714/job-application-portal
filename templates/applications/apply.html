{% extends "base.html" %}

{% block title %}
Apply for {{ job.title }}
{% endblock %}

{% block content %}

<h1>Apply for {{ job.title }}</h1>

<p>
    📍 {{ job.location }}
</p>

<form
    method="POST"
    enctype="multipart/form-data"
>

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Submit Application
    </button>

</form>

{% endblock %}
