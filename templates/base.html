<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Job Portal{% endblock %}
    </title>

    {% load static %}

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

    <nav>

        <a href="{% url 'job_list' %}">
            Job Portal
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'my_applications' %}">
                My Applications
            </a>

            <a href="{% url 'dashboard' %}">
                Dashboard
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'signup' %}">
                Sign Up
            </a>

        {% endif %}

    </nav>

    <main>

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
